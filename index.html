<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Aimi 🐱</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
    overflow-x: hidden;
    background: linear-gradient(-45deg,#ffeef2,#e0f7fa,#fff5e6,#f0fff0);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
}

@keyframes bg {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1 { color:#ff4d6d; }

.card {
    background:white;
    padding:25px;
    border-radius:20px;
    width:70%;
    margin:auto;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

button {
    background:#ff4d6d;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:25px;
    cursor:pointer;
    margin:10px;
}

/* popup */
#popup {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    border-radius:20px;
    width:70%;
    max-height:70%;
    overflow:auto;
    text-align:left;
}

#text { white-space:pre-line; }

/* floating cats */
.floatCat {
    position:absolute;
    font-size:28px;
    animation:float 12s linear infinite;
}

@keyframes float {
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* sparkles */
.spark {
    position:fixed;
    animation:fly 8s linear infinite;
}

@keyframes fly {
    to {transform:translateY(-100vh);opacity:0;}
}

/* confetti */
.confetti {
    position:fixed;
    width:8px;
    height:8px;
    top:0;
    animation:fall 3s linear forwards;
}

@keyframes fall {
    to{transform:translateY(100vh);opacity:0;}
}

/* ===================== */
/* 🐱 REAL IMAGE CAT */
/* ===================== */

#cat {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 180px;
    cursor: pointer;
    transition: 0.3s;
    animation: idle 2s infinite ease-in-out;
}

@keyframes idle {
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

#cat img {
    width: 100%;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
}

.bounce {
    animation: bounce 0.4s;
}

@keyframes bounce {
    50%{transform:scale(1.15);}
}

</style>
</head>

<body>

<h1>🎉 Happy 17th Birthday Aimi Nadhirah 🐱</h1>

<div class="card">
<p>For someone kind & hardworking 💕</p>
<button onclick="openMsg()">Unlock Surprise 🐾</button>
</div>

<div id="popup">
<h3>💌 Message for Aimi</h3>
<p id="text"></p>
</div>

<!-- 🐱 REAL CAT IMAGE -->
<div id="cat" onclick="catClick()" onmouseover="catHover()">
    <img id="catImg" src="https://cdn-icons-png.flaticon.com/512/616/616408.png">
</div>

<script>

/* floating cats */
for(let i=0;i<15;i++){
 let c=document.createElement("div");
 c.className="floatCat";
 c.innerText="🐱";
 c.style.left=Math.random()*100+"vw";
 c.style.animationDuration=(5+Math.random()*10)+"s";
 document.body.appendChild(c);
}

/* sparkles */
for(let i=0;i<25;i++){
 let s=document.createElement("div");
 s.className="spark";
 s.innerHTML="✨";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* confetti */
function confetti(){
 for(let i=0;i<80;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.background=`hsl(${Math.random()*360},100%,70%)`;
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),3000);
 }
}

/* FULL MESSAGE */
let message = `Happy birthday Aimi,

aq just nak cakap thank you sebab dah berkawan dgn aq yg tak seberapa ni. honestly kau antara kawan yg paling baik yang aq pernah jumpa, im so lucky and im grateful for that.

selama kita kawan ni, banyak kau tolong aq. bila aq perlukan kau, mesti kau ada. bila aq rasa kosong, kau teman aq. bila aq sedih, mesti kau ada.

so thank you..

aq ingat first kita jumpa... Roblox days...

I'm sorry for everything I did wrong.

Goodluck for your SPM.

And again.. happy birthday, Aimi 🐱💕`;

/* typing */
function typeText(text,i=0){
 if(i<text.length){
  document.getElementById("text").innerHTML+=text.charAt(i);
  setTimeout(()=>typeText(text,i+1),18);
 }
}

/* open */
function openMsg(){
 document.getElementById("popup").style.display="block";
 document.getElementById("text").innerHTML="";
 typeText(message);
 confetti();
}

/* CAT STATES (REAL IMAGES) */
let cats = [
 "https://cdn-icons-png.flaticon.com/512/616/616408.png", // normal
 "https://cdn-icons-png.flaticon.com/512/616/616430.png", // happy
 "https://cdn-icons-png.flaticon.com/512/616/616408.png", // love (reuse)
 "https://cdn-icons-png.flaticon.com/512/616/616430.png"  // shocked (swap feel)
];

let i=0;

/* click */
function catClick(){
 let img=document.getElementById("catImg");

 i=(i+1)%cats.length;
 img.src=cats[i];

 document.getElementById("cat").classList.add("bounce");
 setTimeout(()=>document.getElementById("cat").classList.remove("bounce"),400);

 confetti();
}

/* hover reaction */
function catHover(){
 let img=document.getElementById("catImg");
 img.style.transform="scale(1.05)";
 setTimeout(()=>img.style.transform="scale(1)",200);
}

</script>

</body>
</html>
