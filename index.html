<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Aimi 🐱</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
    overflow-x: hidden;
    background: linear-gradient(-45deg,#ffeef2,#e0f7fa,#fff5e6,#f0fff0);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
}

@keyframes bg {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1 { color:#ff4d6d; }

.card {
    background:white;
    padding:25px;
    border-radius:20px;
    width:70%;
    margin:auto;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

button {
    background:#ff4d6d;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:25px;
    cursor:pointer;
    margin:10px;
}

/* ================= POPUP OVERLAY ================= */
#popup {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background: rgba(0,0,0,0.65);
    z-index:9999;
}

#popupBox {
    background:white;
    width:70%;
    max-height:80%;
    overflow:auto;
    margin:5% auto;
    padding:20px;
    border-radius:20px;
    text-align:left;
}

#text { white-space:pre-line; }

/* ================= BACKGROUND ELEMENTS ================= */
.floatCat {
    position:absolute;
    font-size:28px;
    animation:float 10s linear infinite;
    z-index:1;
}

@keyframes float {
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

.spark {
    position:fixed;
    animation:fly 8s linear infinite;
    z-index:1;
}

@keyframes fly {
    to{transform:translateY(-100vh);opacity:0;}
}

/* ================= CAT ================= */
#bigCat {
    position: fixed;
    right: 25px;
    bottom: 25px;
    font-size: 90px;
    cursor: pointer;
    user-select: none;
    z-index: 5;
    transition: transform 0.2s;
}

.bounce {
    animation: bounce 0.3s;
}

@keyframes bounce {
    50% { transform: scale(1.25); }
}

</style>
</head>

<body>

<h1>🎉 Happy 17th Birthday, Aimi Nadhirah 🐱</h1>

<div class="card">
<p>For someone kind, hardworking & special 💕</p>
<button onclick="openMsg()">Unlock Surprise 🐾</button>
</div>

<!-- POPUP -->
<div id="popup">
    <div id="popupBox">
        <h3>💌 Message for Aimi</h3>
        <p id="text"></p>
    </div>
</div>

<!-- CAT -->
<div id="bigCat" onclick="changeCat()">😺</div>

<script>

/* floating cats */
for(let i=0;i<15;i++){
 let c=document.createElement("div");
 c.className="floatCat";
 c.innerText="🐱";
 c.style.left=Math.random()*100+"vw";
 c.style.animationDuration=(5+Math.random()*10)+"s";
 document.body.appendChild(c);
}

/* sparkles */
for(let i=0;i<25;i++){
 let s=document.createElement("div");
 s.className="spark";
 s.innerHTML="✨";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* confetti */
function confetti(){
 for(let i=0;i<80;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.position="fixed";
  c.style.width="8px";
  c.style.height="8px";
  c.style.top="0";
  c.style.left=Math.random()*100+"vw";
  c.style.background=`hsl(${Math.random()*360},100%,70%)`;
  c.style.animation="fall 3s linear forwards";
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),3000);
 }
}

/* FULL MESSAGE (FIXED, NO DUPLICATE) */
let message = `Happy birthday Aimi,

aq ingat lagi waktu first kite jumpe kt hutan. kau yg tegur aq pdhl x kenal pun, and lepas sembang lama smpai aq disconnect kau boleh plk gi add aq HAHA.. x sangka sbb x pernah lagi ade org buat mcm tu so its really precious to me.

and aq nak amik peluang ni utk minta maaf , even tho bnyk kali dh kau dgr ni but trust me yang setiap kali aq cakap bende ni I really mean it, I'm sorry.. sorry sbb x dapat jadi kawan yg baik utk kau. sorry sbb x layan kau dgn baik, bnyk salah aq dekat kau and aq harap kau dpt maafkan aq. I'm sorry..

/* typing */
function typeText(text,i=0){
 if(i<text.length){
  document.getElementById("text").innerHTML += text.charAt(i);
  setTimeout(()=>typeText(text,i+1),18);
 }
}

/* open popup */
function openMsg(){
 document.getElementById("popup").style.display="block";
 document.getElementById("text").innerHTML="";
 typeText(message);
 confetti();
}

/* cat */
let cats=["😺","😸","😻","🙀","😼","😿"];
let i=0;

function changeCat(){
 let cat=document.getElementById("bigCat");

 i=(i+1)%cats.length;
 cat.innerText=cats[i];

 cat.classList.add("bounce");
 setTimeout(()=>cat.classList.remove("bounce"),300);

 confetti();
}

</script>

</body>
</html>
