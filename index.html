<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Aimi 🐱</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
    overflow-x: hidden;
    background: linear-gradient(-45deg,#ffeef2,#e0f7fa,#fff5e6,#f0fff0);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
}

@keyframes bg {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1 { color:#ff4d6d; }

.card {
    background:white;
    padding:25px;
    border-radius:20px;
    width:70%;
    margin:auto;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

button {
    background:#ff4d6d;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:25px;
    cursor:pointer;
    margin:10px;
}

/* POPUP */
#popup {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(0,0,0,0.65);
    z-index:9999;
}

#popupBox {
    background:white;
    width:70%;
    max-height:80%;
    overflow:auto;
    margin:5% auto;
    padding:20px;
    border-radius:20px;
    text-align:left;
}

#text { white-space:pre-line; }

/* BACKGROUND EFFECTS */
.floatCat {
    position:absolute;
    font-size:28px;
    animation:float 10s linear infinite;
    z-index:1;
}

@keyframes float {
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

.spark {
    position:fixed;
    animation:fly 8s linear infinite;
    z-index:1;
}

@keyframes fly {
    to{transform:translateY(-100vh);opacity:0;}
}

/* CAT */
#bigCat {
    position: fixed;
    right: 25px;
    bottom: 25px;
    font-size: 90px;
    cursor: pointer;
    user-select: none;
    z-index:5;
    transition: transform 0.2s;
}

.bounce {
    animation: bounce 0.3s;
}

@keyframes bounce {
    50% { transform: scale(1.25); }
}

/* CONFETTI */
.confetti {
    position:fixed;
    width:8px;
    height:8px;
    z-index:9998;
    animation:fall 3s linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(0);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>🎉 Happy 17th Birthday, Aimi Nadhirah 🐱</h1>

<div class="card">
<p>For someone kind, hardworking & special 💕</p>
<button onclick="openMsg()">Unlock Surprise 🐾</button>
</div>

<!-- POPUP -->
<div id="popup">
    <div id="popupBox">
        <h3>💌 Message for Aimi</h3>
        <p id="text"></p>
        <button id="closeBtn" onclick="closeMsg()">Close 💕</button>
    </div>
</div>

<!-- CAT -->
<div id="bigCat" onclick="changeCat()">😺</div>

<script>

/* floating cats */
for(let i=0;i<15;i++){
 let c=document.createElement("div");
 c.className="floatCat";
 c.innerText="🐱";
 c.style.left=Math.random()*100+"vw";
 c.style.animationDuration=(5+Math.random()*10)+"s";
 document.body.appendChild(c);
}

/* sparkles */
for(let i=0;i<25;i++){
 let s=document.createElement("div");
 s.className="spark";
 s.innerHTML="✨";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* CONFETTI FIXED */
function confetti(){
 for(let i=0;i<80;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.top="-10px";
  c.style.background=`hsl(${Math.random()*360},100%,70%)`;
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),4000);
 }
}

/* MESSAGE (UNCHANGED CONTENT) */
let message = `Happy birthday Aimi,

aq just nak cakap thank you sebab dah berkawan dgn aq yg tak seberapa ni. honestly kau antara kawan yg paling baik yang aq pernah jumpa, im so lucky and im grateful for that.

selama kita kawan ni, banyak kau tolong aq. bila aq perlukan kau, mesti kau ada. bila aq rasa kosong, kau teman aq. bila aq sedih, mesti kau ada. so thank you..

aq ingat lagi waktu first kite jumpe kt hutan. kau yg tegur aq pdhl x kenal pun, and lepas sembang lama smpai aq disconnect kau boleh plk gi add aq HAHA..

i remember roblox days.. *sigh*

I'm sorry for everything I did wrong.

Goodluck for your SPM.

And again.. happy birthday, Aimi 🐱💕`;

/* typing */
function typeText(text,i=0){
 if(i<text.length){
  document.getElementById("text").innerHTML += text.charAt(i);
  setTimeout(()=>typeText(text,i+1),18);
 }
}

/* open popup */
function openMsg(){
 document.getElementById("popup").style.display="block";
 document.getElementById("text").innerHTML="";
 typeText(message);
 confetti();
}

/* cat */
let cats=["😺","😸","😻","🙀","😼","😿"];
let i=0;

function changeCat(){
 let cat=document.getElementById("bigCat");

 i=(i+1)%cats.length;
 cat.innerText=cats[i];

 cat.classList.add("bounce");
 setTimeout(()=>cat.classList.remove("bounce"),300);

 confetti();
}

/* close popup upgraded */
function closeMsg(){

 let btn=document.getElementById("closeBtn");
 let cat=document.getElementById("bigCat");

 cat.innerText="🙀";
 btn.innerText="don’t go yet...";

 setTimeout(()=>{

    confetti();
    document.getElementById("popup").style.display="none";

    cat.innerText="😺";

    let bye=document.createElement("div");
    bye.innerText="thank you for reading 💕";
    bye.style.position="fixed";
    bye.style.top="50%";
    bye.style.left="50%";
    bye.style.transform="translate(-50%,-50%)";
    bye.style.background="white";
    bye.style.padding="12px 20px";
    bye.style.borderRadius="15px";
    bye.style.zIndex="10000";
    document.body.appendChild(bye);

    setTimeout(()=>bye.remove(),1500);

    btn.innerText="Close 💕";

 },900);
}

</script>

</body>
</html>
