<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>
  <style>
    body {
      text-align: center;
      font-family: Comic Sans MS;
      background: linear-gradient(to right, pink, lavender);
      color: white;
    }

    h1 {
      margin-top: 100px;
      font-size: 50px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }

    button {
      padding: 10px 20px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: pink;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>🎉 Happy Birthday!!! 🎉</h1>
  <p>You are amazing and I hope your day is full of happiness 💖</p>

  <button onclick="showMessage()">Click me 💌</button>

  <p id="secret"></p>

  <script>
    function showMessage() {
      document.getElementById("secret").innerHTML =
        "Surprise!!! I made this just for you 💕";
    }
  </script>
</body>
</html>
