<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday Aimi Nadhirah!</title>
    <style>
        body {
            background-color: #f0e68c;
            color: #333;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #f77b7c;
        }
        button {
            background-color: #f77b7c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff5252;
        }
    </style>
</head>
<body>
    <h1>Happy Birthday Aimi Nadhirah!</h1>
    <p>Wishing you a day filled with love, joy, and lots of furry friends!</p>
    <button onclick="revealMessage()">Click me for a surprise!</button>
    <p id="personal-message" style="display:none;"></p>
    <script>
        function revealMessage() {
            const message = "Dear Aimi,\nHappy Birthday to you! On this special day, I hope you receive all the love and happiness you deserve. Remember, you are loved as much as a cat loves its nap!\nLove, Your Secret Admirer";
            document.getElementById('personal-message').innerText = message;
            document.getElementById('personal-message').style.display = 'block';
        }
    </script>
</body>
</html>
